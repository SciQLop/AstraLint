name: LogicalSourceFormat
description: "Logical_source must follow ISTP naming convention: source_descriptor_datatype"
url: "https://spdf.gsfc.nasa.gov/istp_guide/gattributes.html#Logical_source"
reference: "ISTP-GA-003"
severity: ERROR
suite: ISTP

assertions:
  # Format: source_name_descriptor_datatype (all lowercase with underscores)
  - path: "attributes/Logical_source/values/[0-9]*"
    check: matches
    pattern: "^[a-z0-9]+_[a-z0-9_]+_[a-z0-9_]+$"
    message: "Logical_source must follow format: source_descriptor_datatype (lowercase with underscores)"

  - path: "attributes/Logical_source/values/[0-9]*"
    check: not_empty
    message: "Logical_source cannot be empty"

