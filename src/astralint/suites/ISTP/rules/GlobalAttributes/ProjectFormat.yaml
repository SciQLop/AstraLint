name: ProjectFormat
description: "Project must follow ISTP convention"
url: "https://istp-metadata.readthedocs.io/en/latest/source/03_metadata-global-attributes.html#project"
reference: "ISTP-GA-012"
# Project is a *Recommended* attribute, so a malformed value is a warning, not an error.
severity: WARNING
suite: ISTP

assertions:
  # Project can be multi-valued, format: ABBREV>Full_Name. The short name may
  # contain spaces and lowercase letters (e.g. "STSP Cluster", "CDAWxx").
  - path: "attributes/Project/values/[0-9]*"
    check: matches
    error_if_no_match: false
    pattern: "^[A-Za-z0-9_ -]+>.+$"
    message: "{% if valid %}Project follows the ABBREV>Full_Name format{% else %}Project must follow format: ABBREV>Full_Name (e.g., 'ISTP>International Solar-Terrestrial Physics'){% endif %}"

  - path: "attributes/Project/values/[0-9]*"
    check: not_empty
    error_if_no_match: false
    message: "{% if valid %}Project is present{% else %}Project cannot be empty{% endif %}"

