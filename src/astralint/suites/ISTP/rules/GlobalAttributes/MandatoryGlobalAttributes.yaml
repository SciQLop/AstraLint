name: MandatoryGlobalAttributes
description: "All mandatory global attributes must be present (ISTP/SPDF required)"
url: "https://spdf.gsfc.nasa.gov/istp_guide/gattributes.html"
reference: "ISTP-GA-001"
severity: ERROR
suite: ISTP

assertions:
  # Required global attributes per ISTP guidelines Section 3
  - path: "attributes"
    check: contains_keys
    keys:
      - Data_type
      - Data_version
      - Descriptor
      - Instrument_type
      - Logical_file_id
      - Logical_source
      - Logical_source_description
      - Mission_group
      - PI_affiliation
      - PI_name
      - Source_name
      - TEXT
    message: "{% if valid %}all mandatory global attributes present{% else %}missing mandatory global attribute(s): {{ missing_keys | join(', ') }}{% endif %}"

