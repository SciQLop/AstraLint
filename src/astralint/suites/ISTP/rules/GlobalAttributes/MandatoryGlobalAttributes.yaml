name: MandatoryGlobalAttributes
description: "All mandatory global attributes must be present (ISTP/SPDF required)"
url: "https://istp-metadata.readthedocs.io/en/latest/source/03_metadata-global-attributes.html"
reference: "ISTP-GA-001"
severity: ERROR
suite: ISTP

assertions:
  # Attributes marked "Required" in the ISTP global-attribute table (Section 3).
  # Note: Instrument_type and Mission_group are "Recommended, required by CDAWeb"
  # rather than ISTP-required, so they live in CDAWebRequiredGlobalAttributes.
  - path: "attributes"
    check: contains_keys
    keys:
      - Data_type
      - Data_version
      - Descriptor
      - Logical_file_id
      - Logical_source
      - Logical_source_description
      - PI_affiliation
      - PI_name
      - Source_name
      - TEXT
    message: "{% if valid %}all mandatory global attributes present{% else %}missing mandatory global attribute(s): {{ missing_keys | join(', ') }}{% endif %}"

