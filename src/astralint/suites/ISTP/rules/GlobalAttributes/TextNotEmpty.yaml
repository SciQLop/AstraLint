name: TextNotEmpty
description: "TEXT attribute must contain meaningful description of the data"
url: "https://istp-metadata.readthedocs.io/en/latest/source/03_metadata-global-attributes.html#text"
reference: "ISTP-GA-011"
severity: ERROR
suite: ISTP

assertions:
  # TEXT is Required and must describe the data. The ISTP Guidelines do not
  # prescribe a minimum length, so only emptiness is enforced as an error.
  - path: "attributes/TEXT/values/[0-9]*"
    check: not_empty
    message: "{% if valid %}TEXT global attribute is present{% else %}TEXT global attribute cannot be empty - must describe the data{% endif %}"

