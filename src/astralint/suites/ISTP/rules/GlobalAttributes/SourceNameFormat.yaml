name: SourceNameFormat
description: "Source_name must follow ISTP convention: ABBREV>Full_Name"
url: "https://istp-metadata.readthedocs.io/en/latest/source/03_metadata-global-attributes.html#source-name"
reference: "ISTP-GA-007"
severity: ERROR
suite: ISTP

assertions:
  # Format: ABBREV>Full_Name (e.g., "GEOTAIL>Geomagnetic Tail"). The doc requires
  # "short and long names, separated by >", but does not mandate an UPPERCASE short
  # name — real values are mixed-case (e.g. "Lanl-01A>..."). Mirror Descriptor/
  # DataType formats which allow [A-Za-z].
  - path: "attributes/Source_name/values/[0-9]*"
    check: matches
    pattern: "^[A-Za-z0-9_-]+>.+$"
    message: "{% if valid %}Source_name follows the ABBREV>Full_Name format{% else %}Source_name must follow format: ABBREV>Full_Name (e.g., 'GEOTAIL>Geomagnetic Tail'){% endif %}"

  - path: "attributes/Source_name/values/[0-9]*"
    check: not_empty
    message: "{% if valid %}Source_name is present{% else %}Source_name cannot be empty{% endif %}"

