name: RecommendedGlobalAttributes
description: "Recommended global attributes should be present for better data discoverability"
url: "https://spdf.gsfc.nasa.gov/istp_guide/gattributes.html"
reference: "ISTP-GA-002"
severity: WARNING
suite: ISTP

assertions:
  - path: "attributes"
    check: contains_keys
    error_if_no_match: false
    keys:
      - Acknowledgement
      - Discipline
      - DOI
      - Generated_by
      - Generation_date
      - HTTP_LINK
      - LINK_TEXT
      - LINK_TITLE
      - MODS
      - Project
      - Rules_of_use
      - spase_DatasetResourceID
      - Time_resolution
    message: "{% if valid %}all recommended global attributes present{% else %}missing recommended global attribute(s): {{ missing_keys | join(', ') }}{% endif %}"

