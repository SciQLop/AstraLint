name: DataTypeFormat
description: "Data_type must follow ISTP convention: ABBREV>Full_description"
url: "https://istp-metadata.readthedocs.io/en/latest/source/03_metadata-global-attributes.html#data-type"
reference: "ISTP-GA-006"
severity: ERROR
suite: ISTP

assertions:
  # Data_type format: ABBREV>Full_description. The short name may contain
  # hyphens and lowercase letters (e.g. "L2-Summary", "l2-gms-62ms").
  - path: "attributes/Data_type/values/[0-9]*"
    check: matches
    pattern: "^[A-Za-z0-9_-]+>.+$"
    message: "{% if valid %}Data_type follows the ABBREV>Full_description format{% else %}Data_type must follow format: ABBREV>Full_description (e.g., 'L2-Summary>level 2 summary'){% endif %}"

  - path: "attributes/Data_type/values/[0-9]*"
    check: not_empty
    message: "{% if valid %}Data_type is present{% else %}Data_type cannot be empty{% endif %}"

