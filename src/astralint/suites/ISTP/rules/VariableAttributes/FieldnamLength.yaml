name: FieldnamLength
description: "FIELDNAM should be concise for plot labels (30 characters max)"
url: "https://istp-metadata.readthedocs.io/en/latest/05_metadata-variable-attributes.html#fieldnam"
reference: "ISTP-VA-007"
severity: WARNING
suite: ISTP

assertions:
  - path: "variables/.*/attributes/FIELDNAM/values/[0-9]*"
    check: length
    max: 30
    message: "{% if valid %}Attribute FIELDNAM of {{ variable }} (length {{ length }}) is within 30 char limit{% else %}Attribute FIELDNAM of {{ variable }} (length {{ length }}) should be 30 characters or less{% endif %}"

  - path: "variables/.*/attributes/FIELDNAM/values/[0-9]*"
    check: not_empty
    message: "{% if valid %}Attribute FIELDNAM of {{ variable }} is not empty{% else %}Attribute FIELDNAM of {{ variable }} cannot be empty{% endif %}"

