name: DataVariableAttributes
description: "Data variables (VAR_TYPE=data) must have additional required attributes"
url: "https://istp-metadata.readthedocs.io/en/latest/source/04_metadata-variables.html#data-variables"
reference: "ISTP-VA-002"
severity: ERROR
suite: ISTP

assertions:
  - check: if_then
    if:
      path: "variables/{var}/attributes/VAR_TYPE/values/0"
      check: comparison
      operator: "="
      value: "data"
    then:
      check: all_of
      assertions:
        - path: "variables/{var}/attributes"
          check: contains_keys
          keys:
            - DEPEND_0
            - DISPLAY_TYPE
            - VALIDMIN
            - VALIDMAX
          message: "{% if valid %}{{ variable }} has all required data attributes{% else %}{{ variable }} missing required attribute(s): {{ missing_keys | join(', ') }}{% endif %}"
        - check: any_of
          message: "{% if valid %}Data variable has LABLAXIS or LABL_PTR_1{% else %}Data variable must have LABLAXIS or LABL_PTR_1{% endif %}"
          assertions:
            - path: "variables/{var}/attributes/LABLAXIS"
              check: exists
              message: ""
            - path: "variables/{var}/attributes/LABL_PTR_1"
              check: exists
              message: ""
        - check: any_of
          message: "{% if valid %}Data variable has UNITS or UNIT_PTR{% else %}Data variable must have UNITS or UNIT_PTR{% endif %}"
          assertions:
            - path: "variables/{var}/attributes/UNITS"
              check: exists
              message: ""
            - path: "variables/{var}/attributes/UNIT_PTR"
              check: exists
              message: ""
