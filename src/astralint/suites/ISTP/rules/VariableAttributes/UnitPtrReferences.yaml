name: UnitPtrReferences
description: "UNIT_PTR must reference an existing variable"
url: "https://istp-metadata.readthedocs.io/en/latest/source/05_metadata-variable-attributes.html#unit_ptr"
reference: "ISTP-VA-016"
severity: ERROR
suite: ISTP

assertions:
  - path: "variables/.*/attributes/UNIT_PTR/values/[0-9]*"
    check: reference_variable
    error_if_no_match: false
    message: "{% if valid %}Attribute UNIT_PTR of {{ variable }} references existing variable '{{ value }}'{% else %}Attribute UNIT_PTR of {{ variable }} references non-existent variable '{{ value }}'{% endif %}"
