name: FormPtrReferences
description: "FORM_PTR must reference an existing variable"
url: "https://spdf.gsfc.nasa.gov/istp_guide/vattributes.html#FORM_PTR"
reference: "ISTP-VA-017"
severity: ERROR
suite: ISTP

assertions:
  - path: "variables/.*/attributes/FORM_PTR/values/[0-9]*"
    check: reference_variable
    error_if_no_match: false
    message: "{% if valid %}Attribute FORM_PTR of {{ variable }} references existing variable '{{ value }}'{% else %}Attribute FORM_PTR of {{ variable }} references non-existent variable '{{ value }}'{% endif %}"
