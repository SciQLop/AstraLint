name: LablPtrReferences
description: "LABL_PTR_1, LABL_PTR_2, LABL_PTR_3 must reference existing variables"
url: "https://istp-metadata.readthedocs.io/en/latest/05_metadata-variable-attributes.html#labl_ptr_i"
reference: "ISTP-VA-012"
severity: ERROR
suite: ISTP

assertions:
  # LABL_PTR_1 must reference existing variable if present
  - path: "variables/.*/attributes/LABL_PTR_1/values/[0-9]*"
    check: reference_variable
    error_if_no_match: false
    message: "{% if valid %}Attribute LABL_PTR_1 of {{ variable }} references existing variable '{{ value }}'{% else %}Attribute LABL_PTR_1 of {{ variable }} references non-existent variable '{{ value }}'{% endif %}"

  # LABL_PTR_2 must reference existing variable if present
  - path: "variables/.*/attributes/LABL_PTR_2/values/[0-9]*"
    check: reference_variable
    error_if_no_match: false
    message: "{% if valid %}Attribute LABL_PTR_2 of {{ variable }} references existing variable '{{ value }}'{% else %}Attribute LABL_PTR_2 of {{ variable }} references non-existent variable '{{ value }}'{% endif %}"

  # LABL_PTR_3 must reference existing variable if present
  - path: "variables/.*/attributes/LABL_PTR_3/values/[0-9]*"
    check: reference_variable
    error_if_no_match: false
    message: "{% if valid %}Attribute LABL_PTR_3 of {{ variable }} references existing variable '{{ value }}'{% else %}Attribute LABL_PTR_3 of {{ variable }} references non-existent variable '{{ value }}'{% endif %}"

