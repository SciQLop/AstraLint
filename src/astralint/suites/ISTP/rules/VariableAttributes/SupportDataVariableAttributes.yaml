name: SupportDataVariableAttributes
description: "Support_data variables must have required attributes"
url: "https://istp-metadata.readthedocs.io/en/latest/source/04_metadata-variables.html#support-data-variables"
reference: "ISTP-VA-003"
severity: ERROR
suite: ISTP

assertions:
  - check: if_then
    if:
      path: "variables/{var}/attributes/VAR_TYPE/values/0"
      check: comparison
      operator: "="
      value: "support_data"
    then:
      check: all_of
      assertions:
        - path: "variables/{var}/attributes"
          check: contains_keys
          keys:
            - CATDESC
            - FIELDNAM
          message: "{% if valid %}{{ variable }} has required support_data attributes{% else %}{{ variable }} missing required attribute(s): {{ missing_keys | join(', ') }}{% endif %}"
        - check: any_of
          message: "{% if valid %}Support_data variable has LABLAXIS or LABL_PTR_1{% else %}Support_data variable must have LABLAXIS or LABL_PTR_1{% endif %}"
          assertions:
            - path: "variables/{var}/attributes/LABLAXIS"
              check: exists
              message: ""
            - path: "variables/{var}/attributes/LABL_PTR_1"
              check: exists
              message: ""
        # FORMAT/FORM_PTR required, except for defined CDF time data types.
        - check: if_then
          if:
            path: "variables/{var}/data_type"
            check: not_in
            values:
              - TT2000
              - CDFEPOCH
              - CDFEPOCH16
          then:
            check: any_of
            message: "{% if valid %}Support_data variable has FORMAT or FORM_PTR{% else %}Support_data variable must have FORMAT or FORM_PTR{% endif %}"
            assertions:
              - path: "variables/{var}/attributes/FORMAT"
                check: exists
                message: ""
              - path: "variables/{var}/attributes/FORM_PTR"
                check: exists
                message: ""
        # UNITS/UNIT_PTR required, except for CDF time data type variables.
        - check: if_then
          if:
            path: "variables/{var}/data_type"
            check: not_in
            values:
              - TT2000
              - CDFEPOCH
              - CDFEPOCH16
          then:
            check: any_of
            message: "{% if valid %}Support_data variable has UNITS or UNIT_PTR{% else %}Support_data variable must have UNITS or UNIT_PTR{% endif %}"
            assertions:
              - path: "variables/{var}/attributes/UNITS"
                check: exists
                message: ""
              - path: "variables/{var}/attributes/UNIT_PTR"
                check: exists
                message: ""
        # VALIDMIN/VALIDMAX required only for record-varying (time-varying) support_data.
        - check: if_then
          if:
            path: "variables/{var}/record_variance"
            check: comparison
            operator: "="
            value: true
          then:
            path: "variables/{var}/attributes"
            check: contains_keys
            keys:
              - VALIDMIN
              - VALIDMAX
            message: "{% if valid %}{{ variable }} has VALIDMIN/VALIDMAX{% else %}{{ variable }} (record-varying) missing required attribute(s): {{ missing_keys | join(', ') }}{% endif %}"
