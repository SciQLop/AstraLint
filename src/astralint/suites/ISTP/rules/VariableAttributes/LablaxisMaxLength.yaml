name: LablaxisMaxLength
description: "LABLAXIS must not exceed 20 characters (hard limit)"
url: "https://istp-metadata.readthedocs.io/en/latest/05_metadata-variable-attributes.html#lablaxis"
reference: "ISTP-VA-022"
severity: ERROR
suite: ISTP

assertions:
  - path: "variables/.*/attributes/LABLAXIS/values/[0-9]*"
    check: length
    max: 20
    error_if_no_match: false
    message: "{% if valid %}Attribute LABLAXIS of {{ variable }} (length {{ length }}) is within 20 char limit{% else %}Attribute LABLAXIS of {{ variable }} (length {{ length }}) exceeds 20 character hard limit{% endif %}"
