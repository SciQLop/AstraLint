name: CatdescMaxLength
description: "CATDESC must not exceed 120 characters (hard limit)"
url: "https://istp-metadata.readthedocs.io/en/latest/source/05_metadata-variable-attributes.html#catdesc"
reference: "ISTP-VA-020"
severity: ERROR
suite: ISTP

assertions:
  - path: "variables/.*/attributes/CATDESC/values/[0-9]*"
    check: length
    max: 120
    error_if_no_match: false
    message: "{% if valid %}Attribute CATDESC of {{ variable }} (length {{ length }}) is within 120 char limit{% else %}Attribute CATDESC of {{ variable }} (length {{ length }}) exceeds 120 character hard limit{% endif %}"
