name: FieldnamMaxLength
description: "FIELDNAM must not exceed 50 characters (hard limit)"
url: "https://istp-metadata.readthedocs.io/en/latest/05_metadata-variable-attributes.html#fieldnam"
reference: "ISTP-VA-021"
severity: ERROR
suite: ISTP

assertions:
  - path: "variables/.*/attributes/FIELDNAM/values/[0-9]*"
    check: length
    max: 50
    error_if_no_match: false
    message: "{% if valid %}Attribute FIELDNAM of {{ variable }} (length {{ length }}) is within 50 char limit{% else %}Attribute FIELDNAM of {{ variable }} (length {{ length }}) exceeds 50 character hard limit{% endif %}"
