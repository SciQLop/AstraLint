name: ProposalAttributes
description: "ISTP proposal attributes (informational)"
url: "https://istp-metadata.readthedocs.io/en/latest/source/05_metadata-variable-attributes.html#coordinate_system"
reference: "ISTP-INFO-001"
severity: INFO
suite: ISTP

assertions:
  - path: "variables/.*/attributes"
    check: contains_keys
    error_if_no_match: false
    keys:
      - COORDINATE_SYSTEM
    message: "{% if valid %}Attribute COORDINATE_SYSTEM of {{ variable }} is present{% else %}Attribute COORDINATE_SYSTEM of {{ variable }} is available for vectors/tensors (proposal){% endif %}"
  - path: "attributes"
    check: contains_keys
    error_if_no_match: false
    keys:
      - Data_processing_level
    message: "PROPOSAL: Data_processing_level attribute is available"
