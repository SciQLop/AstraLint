name: DeltaReferences
description: "DELTA_PLUS_VAR and DELTA_MINUS_VAR must reference existing variables"
url: "https://istp-metadata.readthedocs.io/en/latest/source/05_metadata-variable-attributes.html#delta_plus_var-delta_minus_var"
reference: "ISTP-VA-014"
severity: ERROR
suite: ISTP

assertions:
  # DELTA_PLUS_VAR must reference existing variable if present
  - path: "variables/.*/attributes/DELTA_PLUS_VAR/values/[0-9]*"
    check: reference_variable
    error_if_no_match: false
    message: "{% if valid %}Attribute DELTA_PLUS_VAR of {{ variable }} references existing variable '{{ value }}'{% else %}Attribute DELTA_PLUS_VAR of {{ variable }} references non-existent variable '{{ value }}'{% endif %}"

  # DELTA_MINUS_VAR must reference existing variable if present
  - path: "variables/.*/attributes/DELTA_MINUS_VAR/values/[0-9]*"
    check: reference_variable
    error_if_no_match: false
    message: "{% if valid %}Attribute DELTA_MINUS_VAR of {{ variable }} references existing variable '{{ value }}'{% else %}Attribute DELTA_MINUS_VAR of {{ variable }} references non-existent variable '{{ value }}'{% endif %}"

