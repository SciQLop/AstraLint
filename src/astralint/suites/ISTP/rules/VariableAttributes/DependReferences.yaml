name: DependReferences
description: "DEPEND_0, DEPEND_1, DEPEND_2, DEPEND_3 must reference existing variables"
url: "https://istp-metadata.readthedocs.io/en/latest/05_metadata-variable-attributes.html#depend_0"
reference: "ISTP-VA-011"
severity: ERROR
suite: ISTP

assertions:
  # DEPEND_0 typically references Epoch - must be a valid variable
  - path: "variables/.*/attributes/DEPEND_0/values/0"
    check: reference_variable
    error_if_no_match: false
    message: "{% if valid %}Attribute DEPEND_0 of {{ variable }} references existing variable '{{ value }}'{% else %}Attribute DEPEND_0 of {{ variable }} references non-existent variable '{{ value }}'{% endif %}"

  # DEPEND_1 must reference existing variable if present
  - path: "variables/.*/attributes/DEPEND_1/values/0"
    check: reference_variable
    error_if_no_match: false
    message: "{% if valid %}Attribute DEPEND_1 of {{ variable }} references existing variable '{{ value }}'{% else %}Attribute DEPEND_1 of {{ variable }} references non-existent variable '{{ value }}'{% endif %}"

  # DEPEND_2 must reference existing variable if present
  - path: "variables/.*/attributes/DEPEND_2/values/0"
    check: reference_variable
    error_if_no_match: false
    message: "{% if valid %}Attribute DEPEND_2 of {{ variable }} references existing variable '{{ value }}'{% else %}Attribute DEPEND_2 of {{ variable }} references non-existent variable '{{ value }}'{% endif %}"

  # DEPEND_3 must reference existing variable if present
  - path: "variables/.*/attributes/DEPEND_3/values/0"
    check: reference_variable
    error_if_no_match: false
    message: "{% if valid %}Attribute DEPEND_3 of {{ variable }} references existing variable '{{ value }}'{% else %}Attribute DEPEND_3 of {{ variable }} references non-existent variable '{{ value }}'{% endif %}"

