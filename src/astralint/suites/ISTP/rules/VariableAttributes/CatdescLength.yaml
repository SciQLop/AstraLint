name: CatdescLength
description: "CATDESC should be descriptive but concise (80 characters max per ISTP)"
url: "https://istp-metadata.readthedocs.io/en/latest/05_metadata-variable-attributes.html#catdesc"
reference: "ISTP-VA-006"
severity: WARNING
suite: ISTP

assertions:
  - path: "variables/.*/attributes/CATDESC/values/[0-9]*"
    check: length
    max: 80
    message: "{% if valid %}Attribute CATDESC of {{ variable }} (length {{ length }}) is within 80 char limit{% else %}Attribute CATDESC of {{ variable }} (length {{ length }}) should be 80 characters or less{% endif %}"

  - path: "variables/.*/attributes/CATDESC/values/[0-9]*"
    check: not_empty
    message: "{% if valid %}Attribute CATDESC of {{ variable }} is not empty{% else %}Attribute CATDESC of {{ variable }} cannot be empty - must describe the variable{% endif %}"

