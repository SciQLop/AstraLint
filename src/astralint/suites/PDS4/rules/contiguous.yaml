name: MandatoryGlobalAttributes
description: "All mandatory global attributes must be present"
url: "https://..."
reference: "PDS4-MD-001"
severity: ERROR
suite: PDS4

assertions:
  - path: "variables/.*/attributes"
    check: contains_keys
    keys: [ CATDESC, FIELDNAM, FILLVAL ]
    message: "{% if valid %}{{ variable }} has all required attributes{% else %}{{ variable }} missing attribute(s): {{ missing_keys | join(', ') }}{% endif %}"