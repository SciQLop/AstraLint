name: wasm_tests.yml
on: [push, pull_request]

jobs:
  build-wheel:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Install uv (official Astral action)
      uses: astral-sh/setup-uv@v7
      with:
        # Update this as needed:
        version: "0.9.25"
        enable-cache: true
        python-version: "3.13"
    - name: Set up Python (using uv)
      run: uv python install
    - name: Build wheel
      run: uv build -f wheel
    - name: Upload artifact
      uses: actions/upload-artifact@v6
      with:
        name: astralint-wheel
        path: dist/*.whl

  test:
    needs: build-wheel
    runs-on: ubuntu-latest
    env:
        DISPLAY: :99
        FORCE_COLOR: 3
    steps:
    - uses: actions/checkout@v6
    - name: Set up Python 3.13
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'
        allow-prereleases: true
    - name: Install Node.js
      uses: actions/setup-node@v6
      with:
        node-version: latest
    - name: Cache Playwright Browsers
      uses: actions/cache@v5
      with:
          path: .cache/ms-playwright
          key: ${{ runner.os }}-playwright-latest

    - name: Install Playwright Browsers
      run: pip install playwright && python -m playwright install --with-deps

    - name: Download pyodide wheel artifact
      uses: pyodide/pyodide-actions/download-pyodide@v2
      with:
        version: '0.29.3'
        to: pyodide-dist

    - name: restore speasy wheel artifact
      uses: actions/download-artifact@v7
      with:
        name: astralint-wheel
        path: pyodide-dist/


    - name: Install browser for selenium tests
      uses: pyodide/pyodide-actions/install-browser@0876419b7ac412db2b84e86499bc95ff3b64b004
      with:
        runner: selenium
        browser: chrome
        browser-version: latest

    - name: install pyodide-py
      run: |
        python -m pip install pyodide-py==0.29.3

    - name: Install pytest-pyodide
      run: python -m pip install pytest-pyodide

    - name: Run tests
      run: |
        python -m pytest -vra \
          --dist-dir=./pyodide-dist/ \
          --runner=selenium \
          --rt=chrome \
          tests/test_wasm.py




